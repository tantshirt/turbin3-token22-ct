[package]
name = "turbin3-token22-ct"
version = "0.1.0"
edition = "2021"

[dependencies]
# no spl-token-client on purpose, it doesn't build at any published version.
# see the README. everything here is raw instruction builders.
spl-token-2022-interface = "3.1"
spl-token-metadata-interface = "1.0"
spl-token-confidential-transfer-proof-generation = "0.6"
spl-token-confidential-transfer-proof-extraction = "0.6"

# has to be 7. version 4 builds proofs the current proof program rejects.
solana-zk-sdk = "7"

solana-rpc-client = "4.3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4.3"
solana-message = "4.6"
solana-commitment-config = "3"
solana-address = "2.6"
solana-instruction = "3.5"
solana-program-pack = "3.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
anyhow = "1"
bytemuck = "1.25"
solana-zk-elgamal-proof-interface = "0.1.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
